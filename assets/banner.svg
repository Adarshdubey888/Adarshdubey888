<svg width="1200" height="320" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style><![CDATA[
      .title{
        fill:#00ff41;
        font-family:JetBrains Mono, monospace;
        font-size:34px;
        filter:url(#glow);
      }

      .terminal{
        fill:#00ff41;
        font-family:JetBrains Mono, monospace;
        font-size:22px;
      }

      .small{
        fill:#00ff41;
        font-family:JetBrains Mono, monospace;
        font-size:18px;
      }

      .cursor{
        animation: blink 1s infinite;
      }

      @keyframes blink{
        0%{opacity:1;}
        50%{opacity:0;}
        100%{opacity:1;}
      }

    ]]></style>

  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>

  <text x="40" y="55" class="title">
    CYBER TERMINAL
  </text>

  <text x="40" y="95" class="small">
    > Booting Secure Environment...
  </text>

  <text x="40" y="125" class="small">
    > Connecting to GitHub...
  </text>

  <text x="40" y="155" class="small">
    > Authentication Successful
  </text>

  <text x="40" y="205" class="terminal">
    guest@github:~$
  </text>

  <text x="230" y="205" class="terminal">
    whoami
  </text>

  <text x="40" y="245" class="small">
    Adarsh Dubey
  </text>

  <text x="40" y="272" class="small">
    Cyber Security | Full Stack Developer | MCA Student
  </text>

  <text x="40" y="300" class="small">
    █
  </text>

  <text x="55" y="300" class="cursor small">
    _
  </text>

</svg>
