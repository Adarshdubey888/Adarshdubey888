<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#050505"/>
<stop offset="100%" stop-color="#0d1117"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="2" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<style><![CDATA[

.title{
fill:#00ff66;
font-size:30px;
font-family:JetBrains Mono,monospace;
font-weight:bold;
}

.text{
fill:#00ff66;
font-size:22px;
font-family:JetBrains Mono,monospace;
}

.small{
fill:#00ff66;
font-size:18px;
font-family:JetBrains Mono,monospace;
}

.cursor{
animation:blink 1s infinite;
}

@keyframes blink{
0%{opacity:1;}
50%{opacity:0;}
100%{opacity:1;}
}

]]></style>

</defs>

<!-- Background -->

<rect width="1200" height="360" fill="url(#bg)"/>

<!-- Terminal -->

<rect
x="40"
y="35"
rx="14"
ry="14"
width="1120"
height="290"
fill="#000000"
stroke="#00ff66"
stroke-width="2"/>

<!-- Terminal Header -->

<rect
x="40"
y="35"
width="1120"
height="40"
rx="14"
fill="#161b22"/>

<!-- macOS Buttons -->

<circle cx="70" cy="55" r="7" fill="#ff5f56"/>
<circle cx="95" cy="55" r="7" fill="#ffbd2e"/>
<circle cx="120" cy="55" r="7" fill="#27c93f"/>

<text x="520" y="60" class="small">
Cyber Terminal
</text>

<!-- Boot -->

<text x="70" y="105" class="small">
&gt; Booting Linux Kernel...
</text>

<text x="70" y="135" class="small">
&gt; Loading Security Modules...
</text>

<text x="70" y="165" class="small">
&gt; Connecting to GitHub...
</text>

<text x="70" y="195" class="small">
&gt; Access Granted
</text>

<!-- Prompt -->

<text
x="70"
y="245"
class="text"
filter="url(#glow)">
guest@github:~$
</text>

<text
x="300"
y="245"
class="text"
filter="url(#glow)">
whoami
</text>

<!-- Identity -->

<text
x="70"
y="280"
class="small">
Name : Adarsh Dubey
</text>

<text
x="70"
y="305"
class="small">
Role : Cyber Security | Full Stack Developer
</text>

<text
x="70"
y="330"
class="small">
Status : Online
</text>

<!-- Cursor -->

<text
x="255"
y="245"
class="text cursor">
█
</text>

</svg>
