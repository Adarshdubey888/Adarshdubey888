        fill:#9ef7b1;
      }

      .small{
        font:16px 'JetBrains Mono',monospace;
        fill:#6eff8f;
      }

      .cursor{
        animation:blink 1s infinite;
      }

      @keyframes blink{
        50%{opacity:0;}
      }
    ]]></style>

  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

